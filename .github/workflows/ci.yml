name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  android:
    name: Build Android
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Fixed debug signing key: every CI APK gets the same signature, so a new build installs over the old one
      # (a fresh random key per run makes Android refuse the update). Absent: Gradle makes its own, as before.
      - name: Debug signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            # tr keeps only base64 characters: the secret was stored from Windows and carries stray bytes (BOM, CR/LF)
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | tr -cd 'A-Za-z0-9+/=' | base64 -d > android/debug.keystore
          fi
      # Firebase config is git-ignored; rebuilt from a repo secret. Absent (forks, PRs): the app builds with sharing off.
      - name: Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          fi
      # debug build: no release keystore in CI (android/key.properties is git-ignored)
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: pettime-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

  # iOS is left out for now (slow macOS runner). To bring it back, add a job on `macos-latest` that runs
  # `flutter pub get` then `flutter build ios --release --no-codesign` (compile check only, no Apple account needed).
